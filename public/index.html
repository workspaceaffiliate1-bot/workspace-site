<div class="ws-root {{themeClass}}" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: Onest, -apple-system, 'SF Pro Display', sans-serif; overflow-x: hidden">

<!-- HERO WRAPPER (full-bleed background) -->
<div id="top" style="position: relative; overflow: hidden">

  <!-- animated Gradient ASCII background (React Bits, brand palette) -->
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; inset: 0"><canvas ref="{{heroRef}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas></div>
    </sc-if>
    <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0"><canvas ref="{{heroBendsRef}}" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(243, 241, 238, 0.82) 0%, rgba(243, 241, 238, 0.45) 45%, rgba(243, 241, 238, 0) 75%)"></div>
    </sc-if>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 72%, var(--bg) 100%)"></div>
  </div>

  <!-- HEADER -->
  <header style="position: relative; max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <a href="#top" style="text-decoration: none; color: var(--text); font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Work<span style="color: #E85002">Space</span></a>
    <nav style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 16px; font-weight: 500">
      <a href="#jobs" style="color: var(--soft); text-decoration: none">{{t.nav_jobs}}</a>
      <a href="#prices" style="color: var(--soft); text-decoration: none">{{t.nav_emp}}</a>
      <a href="#about" style="color: var(--soft); text-decoration: none">{{t.nav_about}}</a>
    </nav>
    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" class="ws-glass" onClick="{{ toggleTheme }}" aria-label="{{t.theme}}" style="width: 44px; height: 44px; border-radius: 50%; color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        </sc-if>
      </button>
      <div class="ws-glass" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px" role="group" aria-label="Язык / Мова">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
          <button type="button" onClick="{{ l.pick }}" style="{{l.style}}">{{l.label}}</button>
        </sc-for>
      </div>
      <a href="https://t.me/WorkSpace_1" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #E85002; color: #000000; font-weight: 700; font-size: 15px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"></path><path d="m9 13 8-6"></path></svg>
        {{t.tg}}
      </a>
    </div>
  </header>

  <!-- HERO -->
  <section style="position: relative; max-width: 1280px; margin: 0 auto; padding: clamp(40px, 7vw, 96px) clamp(16px, 4vw, 40px) clamp(64px, 9vw, 140px)">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 40px">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <h1 style="margin: 0; font-size: clamp(26px, 8.3vw, 104px); line-height: 1.02; letter-spacing: -0.04em; font-weight: 800; text-wrap: balance">{{t.h1}} <span style="color: #E85002">{{t.h2}}</span></h1>
        <p style="margin: -14px 0 0; max-width: 560px; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.5; color: var(--muted)">{{t.sub}}</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a href="#jobs" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; border-radius: 999px; background: #E85002; color: #000000; font-weight: 700; font-size: 17px; text-decoration: none">{{t.cta_jobs}}</a>
          <a href="#prices" class="ws-glass" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; border-radius: 999px; color: var(--text); font-weight: 600; font-size: 17px; text-decoration: none">{{t.cta_post}}</a>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- TICKER -->
<div aria-hidden="true" style="border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow: hidden; padding: 20px 0">
  <div class="ws-track" style="display: flex; width: max-content; gap: 40px; font-size: 22px; font-weight: 600; white-space: nowrap; color: var(--text)">
    <span>Media Buyer</span><span style="color: #E85002">✱</span><span>Affiliate Manager</span><span style="color: #E85002">✱</span><span>Creative Designer</span><span style="color: #E85002">✱</span><span>Team Lead</span><span style="color: #E85002">✱</span><span>Farmer</span><span style="color: #E85002">✱</span><span>Head of Media Buying</span><span style="color: #E85002">✱</span><span>Tech Specialist</span><span style="color: #E85002">✱</span>
    <span>Media Buyer</span><span style="color: #E85002">✱</span><span>Affiliate Manager</span><span style="color: #E85002">✱</span><span>Creative Designer</span><span style="color: #E85002">✱</span><span>Team Lead</span><span style="color: #E85002">✱</span><span>Farmer</span><span style="color: #E85002">✱</span><span>Head of Media Buying</span><span style="color: #E85002">✱</span><span>Tech Specialist</span><span style="color: #E85002">✱</span>
  </div>
</div>

<!-- JOB BOARD (hot vacancies pinned on top) -->
<section id="jobs" style="max-width: 1280px; margin: 0 auto; padding: clamp(56px, 8vw, 112px) clamp(16px, 4vw, 40px) clamp(48px, 7vw, 96px); display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="color: var(--accent-ink); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em">{{t.hot_kicker}}</span>
      <h2 style="margin: 0; font-size: clamp(34px, 4.6vw, 64px); line-height: 1; letter-spacing: -0.03em; font-weight: 800">{{t.board_title}}</h2>
    </div>
    <span style="padding: 8px 16px; border: 1px solid #E85002; border-radius: 999px; font-size: 14px; color: var(--text)">{{updatedText}}</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 28px; background: var(--surface2); box-shadow: var(--shadow)">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 14px; color: var(--muted)">{{t.f_country}} <span style="opacity: 0.75">· {{t.f_multi}}</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="{{t.f_country}}">
        <sc-for list="{{countries}}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{ c.pick }}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="height: 1px; background: var(--line)"></div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 14px; color: var(--muted)">{{t.f_dir}}</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px" role="group" aria-label="{{t.f_dir}}">
        <sc-for list="{{dirs}}" as="d" hint-placeholder-count="8">
          <button type="button" onClick="{{ d.pick }}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="font-size: 15px; color: var(--muted)">{{countText}}</div>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{jobs}}" as="j" hint-placeholder-count="6">
      <article style="{{j.rowStyle}}">
        <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-if value="{{j.hot}}" hint-placeholder-val="{{ false }}">
              <span style="padding: 4px 10px; border-radius: 8px; background: #E85002; color: #000; font-size: 12px; font-weight: 800; letter-spacing: 0.06em">HOT</span>
            </sc-if>
            <sc-if value="{{j.hasVertical}}" hint-placeholder-val="{{ true }}">
              <span style="padding: 4px 10px; border-radius: 8px; border: 1px solid #E85002; font-size: 12px; color: var(--text)">{{j.vertical}}</span>
            </sc-if>
            <span style="padding: 4px 10px; border-radius: 8px; background: var(--chip); font-size: 12px; color: var(--soft)">{{j.formatLabel}}</span>
          </div>
          <h3 style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">{{j.title}}</h3>
          <sc-if value="{{j.hasWhere}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 15px; color: var(--muted)">{{j.where}}</div>
          </sc-if>
        </div>
        <div style="flex: 1 1 240px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 16px">
          <span style="font-size: 15px; font-weight: 500; color: var(--muted)">{{j.salary}}</span>
          <a href="{{j.link}}" class="ws-spec" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1.5px solid #E85002; color: var(--text); font-weight: 600; font-size: 15px; text-decoration: none">{{t.apply}} →</a>
        </div>
      </article>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 40px 28px; border-radius: 24px; border: 1px dashed var(--muted); color: var(--soft); font-size: 17px; line-height: 1.5">{{t.empty}}</div>
    </sc-if>
  </div>
</section>

<!-- PRICING -->
<div style="position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
  <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">

      .concat(['ua', 'pl', 'remote', 'hybrid'].map((k) => ({ label: t.fm[k], pressed: sel.indexOf(k) >= 0 ? 'true' : 'false', style: sel.indexOf(k) >= 0 ? on : off, pick: () => toggleFormat(k) })));
    const dirs = ['all', 'buy', 'aff', 'tech', 'devops', 'design', 'sales', 'other'].map((k) => ({ label: t.d[k], pressed: k === this.state.dir ? 'true' : 'false', style: k === this.state.dir ? on : off, pick: () => this.setState({ dir: k }) }));
    const fitsFormat = (j) => sel.length === 0 || sel.some((k) => (k === 'ua' && j.country === 'ua') || (k === 'pl' && j.country === 'pl') || (k === 'remote' && j.format === 'remote') || (k === 'hybrid' && j.format === 'hybrid'));
    const rowBase = 'display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; border-radius: 24px; ';
    const view = (j) => ({
      title: j.title, vertical: j.vertical, hasVertical: !!j.vertical, salary: j.salary[L], hot: j.hot, dirLabel: t.d[j.dir],
      link: j.contact ? 'https://t.me/' + j.contact : 'https://t.me/WorkSpace_1/' + j.post,
      rowStyle: rowBase + (j.hot ? 'background: var(--card-bg); border: 1.5px solid #E85002; box-shadow: var(--shadow);' : 'background: var(--surface); border: 1px solid var(--line);'),
      formatLabel: j.country === 'remote' ? t.fm.remote : t.c[j.country] + ' · ' + t.f[j.format],
      where: [j.city ? j.city[L] : null, j.note ? j.note[L] : null].filter((x) => x).join(' · '),
      hasWhere: !!(j.city || j.note)
    });
    const all = this.data();
    const hot = [];
    let updatedText = t.updated;
    if (this.state.liveDate) {
      try { updatedText = t.updated.split(':')[0] + ': ' + new Date(this.state.liveDate).toLocaleDateString(L === 'ua' ? 'uk-UA' : 'ru-RU', { day: 'numeric', month: 'long' }); } catch (e) {}
    }
    const jobs = all.slice().sort((a, b) => (b.hot ? 1 : 0) - (a.hot ? 1 : 0)).filter((j) => fitsFormat(j) && (this.state.dir === 'all' || j.dir === this.state.dir)).map(view);
    const cardBase = 'flex: 1 1 260px; min-width: 0; box-sizing: border-box; padding: 28px; border-radius: 28px; display: flex; flex-direction: column; gap: 20px; ';
    const btnBase = 'display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; font-weight: 700; font-size: 16px; text-decoration: none; ';
    const cfg = this.state.cfg;
    const MAXQ = { pubs: 50, p12: 30, p24: 30, p48: 30, stories: 30, ads: 10 };
    const UNIT = { p12: 8, p24: 15, p48: 28, stories: 15, ads: 50 };
    const pubPrice = (n) => (n <= 0 ? 0 : n === 1 ? 20 : n === 2 ? 36 : n === 3 ? 50 : n === 4 ? 60 : n * 12);
    const subtotal = pubPrice(cfg.pubs) + Object.keys(UNIT).reduce((sum, k) => sum + cfg[k] * UNIT[k], 0);
    const rate = subtotal >= 300 ? 0.07 : subtotal >= 150 ? 0.05 : 0;
    const discount = Math.round(subtotal * rate);
    const total = subtotal - discount;
    const hasItems = Object.keys(cfg).some((k) => cfg[k] > 0);
    const stepBase = 'width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); background: transparent; color: var(--text); font: 500 22px/1 Onest, sans-serif; cursor: pointer; ';
    const setQ = (k, v) => this.setState({ cfg: Object.assign({}, cfg, { [k]: Math.max(0, Math.min(MAXQ[k], v)) }), copied: false });
    const consRows = ['pubs', 'p12', 'p24', 'p48', 'stories', 'ads'].map((k) => {
      const lab = t.pr.cons_items[k];
      const v = cfg[k];
      return {
        label: lab[0], hint: lab[1], value: v,
        dec: () => setQ(k, v - 1), inc: () => setQ(k, v + 1),
        decDisabled: v <= 0, incDisabled: v >= MAXQ[k],
        decLabel: t.pr.less + ': ' + lab[0], incLabel: t.pr.more + ': ' + lab[0],
        decStyle: stepBase + (v <= 0 ? 'opacity: 0.35; cursor: default;' : ''),
        incStyle: stepBase + (v >= MAXQ[k] ? 'opacity: 0.35; cursor: default;' : 'border-color: #E85002;')
      };
    });
    const PKG = [
      { pubs: 5, p12: 1, p24: 0, p48: 0, stories: 0, ads: 0, price: 60 },
      { pubs: 10, p12: 0, p24: 2, p48: 0, stories: 2, ads: 0, price: 155 },
      { pubs: 20, p12: 0, p24: 6, p48: 0, stories: 4, ads: 0, price: 360 },
      { pubs: 40, p12: 0, p24: 15, p48: 0, stories: 8, ads: 0, price: 720 }
    ];
    let better = null;
    if (hasItems) {
      PKG.forEach((pk, i) => {
        const covers = Object.keys(cfg).every((k) => pk[k] >= cfg[k]);
        if (covers && pk.price < total && (!better || pk.price < better.price)) better = { name: t.pr.pkgs[i].name, price: pk.price };
      });
    }
    const orderLines = consRows.filter((r) => r.value > 0).map((r) => '• ' + r.label + ': ' + r.value);
    const orderText = [t.pr.order_hello].concat(orderLines).concat([t.pr.order_total + ': ' + total + '$']).join('\n');
    const MANAGER = 'https://t.me/WorkSpace_Emilia';
    const fm = this.state.form;
    const setField = (k) => (e) => { const v = e && e.target ? e.target.value : ''; this.setState({ form: Object.assign({}, this.state.form, { [k]: v }) }); };
    const formText = [t.form_hello]
      .concat(fm.company ? [t.l_company + ': ' + fm.company] : [])
      .concat(fm.role ? [t.l_role + ': ' + fm.role] : [])
      .concat(fm.contact ? [t.l_contact + ': ' + fm.contact] : [])
      .concat(fm.note ? [t.l_note + ': ' + fm.note] : [])
      .join('\n');
    const consOrder = () => {
      try { if (navigator.clipboard) navigator.clipboard.writeText(orderText); } catch (e) {}
      this.setState({ copied: true });
    };
    const pkgs = t.pr.pkgs.map((p, i) => {
      const accent = i === 1;
      return {
        name: p.name, price: p.price,
        items: p.items.map((x) => ({ text: x })),
        cls: accent ? 'ws-frost ws-frost-accent' : 'ws-frost',
        cardStyle: cardBase + (accent ? 'color: #000000;' : 'color: var(--text);'),
        btnStyle: btnBase + (accent ? 'background: #000000; color: #F9F9F9;' : 'background: #E85002; color: #000000;')
      };
    });
    return {
      t, langs, countries, dirs, hot, jobs, pkgs, updatedText,
      consRows, consSubtotal: subtotal + '$', consHasDiscount: discount > 0, consDiscount: '−' + discount + '$',
      consDiscountLabel: t.pr.discount + ' ' + Math.round(rate * 100) + '%', consTotal: total + '$',
      consHasItems: hasItems, consNoItems: !hasItems, consCopied: this.state.copied && hasItems,
      consHasBetter: !!better, consBetter: better ? t.pr.better(better.name, better.price, total - better.price) : '',
      consLink: MANAGER + '?text=' + encodeURIComponent(orderText), consOrder,
      heroRef: this.heroRef, priceRef: this.priceRef, heroBendsRef: this.heroBendsRef, priceBendsRef: this.priceBendsRef, veilRef: this.veilRef,
      themeClass: isDark ? 'ws-dark' : 'ws-light',
      isDark, isLight: !isDark,
      toggleTheme: () => this.setState({ theme: isDark ? 'light' : 'dark' }),
      countText: t.found + jobs.length,
      empty: jobs.length === 0,
      sent: this.state.sent, notSent: !this.state.sent,
      form: this.state.form, formLink: MANAGER + '?text=' + encodeURIComponent(formText),
      onCompany: setField('company'), onRole: setField('role'), onContact: setField('contact'), onNote: setField('note'),
      send: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText(formText); } catch (e) {}
        this.setState({ sent: true });
      }
    };
  }
}
</script><script>
(function () {
  const tpl = document.getElementById('tpl').content;
  const root = document.getElementById('root');
  const comp = new Component({});
  let init = {};
  try { init = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch (e) {}
  Object.keys(init).forEach((k) => { comp.state[k] = (typeof init[k] === 'object' && !Array.isArray(init[k]) && comp.state[k]) ? Object.assign({}, comp.state[k], init[k]) : init[k]; });
  let oldRefs = [];
  comp._rerender = function (first) {
    oldRefs.forEach(([fn]) => fn(null));
    const frag = document.createDocumentFragment();
    const refs = [];
    render(tpl, comp.renderVals(), frag, refs);
    root.replaceChildren(frag);
    refs.forEach(([fn, el]) => fn(el));
    oldRefs = refs;
    if (first) { if (comp.componentDidMount) comp.componentDidMount(); }
    else if (comp.componentDidUpdate) comp.componentDidUpdate();
  };
  comp._rerender(true);
  window.__comp = comp;
})();
</script></body></html>
